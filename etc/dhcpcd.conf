# 使用 DUID + IAID 作为 DHCPv4 的 Client ID（RFC4361）。比 clientid 更现代，兼容大多数服务器。
duid

# dhcpcd 退出时保留接口配置（不会清除 IP、路由等）。
persistent

# 清空默认的 vendor class id，避免向 DHCP 服务器发送 dhcpcd-<version>:<os>:<machine>:<platform> 信息（隐私/兼容性考虑）。
vendorclassid

# 向 DHCP 服务器请求 DNS 服务器、域名、搜索域。
# option domain_name_servers, domain_name, domain_search

# 请求静态路由（RFC3442）。
option static_routes, classless_static_routes

# 请求并应用网络 MTU。
option interface_mtu

# 请求主机名。（只要你的 DHCP 服务器配置了向客户端推送主机名，你的机器就会在获取租约后被改名。）
# option host_name

# 强制要求 DHCP 响应中带 ServerID（RFC2131 要求）。
require dhcp_server_identifier

# IPv6 使用基于 DUID 的稳定隐私地址（RFC7217），而非硬件地址派生的 SLAAC 地址。
slaac private

# 静态 dns 服务器
static domain_name_servers=223.5.5.5 8.8.8.8
